name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1" # segunda-feira, 06:00 UTC (03:00 America/Sao_Paulo)
  workflow_dispatch:

# Só lê o repositório e abre PRs: nunca faz push em main nem dispara deploy.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (dependências)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: info
