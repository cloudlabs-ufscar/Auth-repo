name: Deploy IAM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# id-token: write é o que permite pedir o JWT do GitHub (OIDC) para trocar por um
# token de 15 min no OpenBao. Sem isso o deploy não tem como ler os segredos.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy IAM via Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub OIDC token for OpenBao
        id: openbao-oidc
        run: |
          set -euo pipefail
          AUDIENCE="https://vault.maas:8200"
          RESPONSE=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          JWT=$(printf '%s' "$RESPONSE" | jq -r '.value // empty')
          if [ -z "$JWT" ]; then
            echo "::error::Nao foi possivel obter o JWT do GitHub: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$JWT"
          echo "jwt=$JWT" >> "$GITHUB_OUTPUT"

      - name: Connect and Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          ACTIONS_ID_TOKEN: ${{ steps.openbao-oidc.outputs.jwt }}
          KEYCLOAK_GITHUB_CLIENT_ID: ${{ secrets.KEYCLOAK_GITHUB_CLIENT_ID }}
          KEYCLOAK_GITHUB_CLIENT_SECRET: ${{ secrets.KEYCLOAK_GITHUB_CLIENT_SECRET }}
          # A ref que disparou o run. O script roda no nimbus (remoto), então o
          # valor precisa ir no env: não existe $GITHUB_REF_NAME lá.
          DEPLOY_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 20m
          envs: ACTIONS_ID_TOKEN,DEPLOY_REF,KEYCLOAK_GITHUB_CLIENT_ID,KEYCLOAK_GITHUB_CLIENT_SECRET
          script: |
            set -e

            echo "[*] Navigating to repository directory..."
            mkdir -p ~/repos
            if [ ! -d ~/repos/Auth-repo/.git ]; then
              echo "[*] Cloning repository for the first time..."
              git clone https://github.com/cloudlabs-ufscar/Auth-repo.git ~/repos/Auth-repo
            fi

            cd ~/repos/Auth-repo

            EXPECTED_URL="https://github.com/cloudlabs-ufscar/Auth-repo.git"
            CURRENT_URL=$(git remote get-url origin)

            if [ "$CURRENT_URL" != "$EXPECTED_URL" ]; then
              echo "[!] Remote URL ($CURRENT_URL) does not match expected repository!"
              exit 1
            fi

            REF="${DEPLOY_REF:-main}"
            echo "[*] Fetching and resetting to origin/$REF..."
            git fetch origin "$REF"
            git reset --hard "origin/$REF"

            echo "[*] Repository updated successfully (ref: $REF)."

            echo "[*] Navigating to Ansible scripts..."
            cd ~/repos/Auth-repo/scripts/ansible-iam

            EXTRA_VARS=""
            if [ -n "$KEYCLOAK_GITHUB_CLIENT_ID" ]; then
              EXTRA_VARS="$EXTRA_VARS -e github_client_id=$KEYCLOAK_GITHUB_CLIENT_ID"
            fi
            if [ -n "$KEYCLOAK_GITHUB_CLIENT_SECRET" ]; then
              EXTRA_VARS="$EXTRA_VARS -e github_client_secret=$KEYCLOAK_GITHUB_CLIENT_SECRET"
            fi

            echo "[*] Executing Ansible IAM playbook..."
            ansible-playbook -i inventory/inventory tasks/first-deploy.yml $EXTRA_VARS

            echo "[*] IAM deployment completed successfully!"
