---
- name: Install required prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - libcap2-bin
      - logrotate
    state: present
    cache_valid_time: 3600

- name: Check installed OpenBao package version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - openbao
  register: openbao_pkg_version
  changed_when: false
  failed_when: false

- name: Decide whether the package needs to be installed
  ansible.builtin.set_fact:
    openbao_needs_install: >-
      {{ (openbao_pkg_version.rc | default(1)) != 0
         or (openbao_pkg_version.stdout | default('') | trim) != openbao_version }}

- name: Refuse to downgrade an OpenBao that is newer than the repo version
  ansible.builtin.assert:
    that: openbao_pkg_version.stdout | trim is version(openbao_version, '<=')
    fail_msg: >-
      O host {{ inventory_hostname }} tem OpenBao {{ openbao_pkg_version.stdout | trim }}
      e o repositório pede {{ openbao_version }}. Atualize openbao_version no
      repositório em vez de rebaixar o serviço.
  when: (openbao_pkg_version.rc | default(1)) == 0

- name: Ensure files directory exists on controller
  ansible.builtin.file:
    path: "{{ role_path }}/files"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: no
  run_once: yes

- name: Download OpenBao deb package on controller (Nimbus)
  ansible.builtin.get_url:
    url: "{{ openbao_download_url }}"
    dest: "{{ role_path }}/files/{{ openbao_deb_name }}"
    mode: "0644"
  delegate_to: localhost
  become: no
  when: openbao_needs_install | bool

- name: Copy OpenBao deb package to target
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ openbao_deb_name }}"
    dest: "/tmp/{{ openbao_deb_name }}"
    mode: "0644"
  when: openbao_needs_install | bool

- name: Install OpenBao deb package
  ansible.builtin.apt:
    deb: "/tmp/{{ openbao_deb_name }}"
    state: present
  when: openbao_needs_install | bool

- name: Ensure OpenBao data directory exists
  ansible.builtin.file:
    path: "{{ openbao_dir_data }}"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "0700"

- name: Create vault symlinks pointing to bao
  ansible.builtin.file:
    src: /usr/bin/bao
    dest: "{{ item }}"
    state: link
    force: yes
  loop:
    - /usr/bin/vault
    - /usr/local/bin/bao
    - /usr/local/bin/vault

- name: Check whether the OpenBao service is already running
  ansible.builtin.command: systemctl is-active --quiet openbao
  register: openbao_unit
  changed_when: false
  failed_when: false

- name: Remember whether OpenBao was already running
  ansible.builtin.set_fact:
    openbao_unit_active: "{{ openbao_unit.rc == 0 }}"

- name: Deploy OpenBao HCL configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_dir_config }}/openbao.hcl"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "0640"
  notify: reload openbao

- name: Set environment variables for shell sessions
  ansible.builtin.copy:
    dest: /etc/profile.d/openbao.sh
    content: |
      export BAO_ADDR="http://127.0.0.1:8200"
      export VAULT_ADDR="http://127.0.0.1:8200"
    mode: "0644"

- name: Flush handlers to start OpenBao before initialization
  ansible.builtin.meta: flush_handlers

- name: Ensure OpenBao service is started and enabled
  ansible.builtin.systemd:
    name: openbao
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for OpenBao API port to be available
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8200
    delay: 2
    timeout: 30

- name: Check OpenBao initialization status
  ansible.builtin.command: /usr/bin/bao status -format=json
  register: openbao_status_raw
  changed_when: false
  failed_when: false
  environment:
    BAO_ADDR: "http://127.0.0.1:8200"

- name: Parse OpenBao status
  ansible.builtin.set_fact:
    openbao_initialized: "{{ (openbao_status_raw.stdout | from_json).initialized | default(false) }}"
  when: openbao_status_raw.stdout | length > 0

# Primary node initialization (only on groups['vault'][0])
- name: Initialize OpenBao operator (1 share, threshold 1) on primary node
  ansible.builtin.command: /usr/bin/bao operator init -key-shares=1 -key-threshold=1 -format=json
  register: openbao_init_output
  environment:
    BAO_ADDR: "http://127.0.0.1:8200"
  when:
    - inventory_hostname == groups['vault'][0]
    - not (openbao_initialized | default(false))

- name: Save unseal key on primary node
  ansible.builtin.copy:
    content: "{{ (openbao_init_output.stdout | from_json).unseal_keys_b64[0] }}"
    dest: "{{ openbao_dir_data }}/unseal.key"
    owner: root
    group: root
    mode: "0400"
  when:
    - inventory_hostname == groups['vault'][0]
    - openbao_init_output is changed

- name: Save root token on primary node
  ansible.builtin.copy:
    content: "{{ (openbao_init_output.stdout | from_json).root_token }}"
    dest: "{{ openbao_dir_data }}/root.token"
    owner: root
    group: root
    mode: "0400"
  when:
    - inventory_hostname == groups['vault'][0]
    - openbao_init_output is changed

# Follower nodes joining Raft cluster (for nodes other than primary)
- name: Join Raft cluster from follower nodes
  ansible.builtin.command: /usr/bin/bao operator raft join http://{{ groups['vault'][0] }}:8200
  register: raft_join_output
  environment:
    BAO_ADDR: "http://127.0.0.1:8200"
  when:
    - inventory_hostname != groups['vault'][0]
    - not (openbao_initialized | default(false))

# Distribute unseal key and root token from primary node to all nodes
- name: Read unseal key from primary vault node
  ansible.builtin.slurp:
    src: "{{ openbao_dir_data }}/unseal.key"
  register: primary_unseal_key_b64
  delegate_to: "{{ groups['vault'][0] }}"
  run_once: yes

- name: Distribute unseal key to all vault nodes
  ansible.builtin.copy:
    content: "{{ primary_unseal_key_b64.content | b64decode }}"
    dest: "{{ openbao_dir_data }}/unseal.key"
    owner: root
    group: root
    mode: "0400"

- name: Read root token from primary vault node
  ansible.builtin.slurp:
    src: "{{ openbao_dir_data }}/root.token"
  register: primary_root_token_b64
  delegate_to: "{{ groups['vault'][0] }}"
  run_once: yes

- name: Distribute root token to all vault nodes
  ansible.builtin.copy:
    content: "{{ primary_root_token_b64.content | b64decode }}"
    dest: "{{ openbao_dir_data }}/root.token"
    owner: root
    group: root
    mode: "0400"

# Auto-unseal setup on all nodes
- name: Deploy auto-unseal script
  ansible.builtin.template:
    src: openbao-unseal.sh.j2
    dest: /usr/local/bin/openbao-unseal.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy auto-unseal systemd service
  ansible.builtin.template:
    src: openbao-unseal.service.j2
    dest: /etc/systemd/system/openbao-unseal.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd

- name: Ensure auto-unseal service is enabled and started
  ansible.builtin.systemd:
    name: openbao-unseal
    state: started
    enabled: yes
    daemon_reload: yes

- name: Execute auto-unseal to ensure OpenBao is unsealed
  ansible.builtin.command: /usr/local/bin/openbao-unseal.sh
  changed_when: false

- name: Verify OpenBao status on each node
  ansible.builtin.command: /usr/bin/bao status
  register: openbao_node_status
  changed_when: false
  environment:
    BAO_ADDR: "http://127.0.0.1:8200"

- name: Display OpenBao node status
  ansible.builtin.debug:
    var: openbao_node_status.stdout_lines

- name: Check Raft cluster peers from primary node
  ansible.builtin.command: /usr/bin/bao operator raft list-peers -format=json
  register: openbao_raft_peers_raw
  changed_when: false
  delegate_to: "{{ groups['vault'][0] }}"
  run_once: yes
  environment:
    BAO_ADDR: "http://127.0.0.1:8200"
    BAO_TOKEN: "{{ primary_root_token_b64.content | b64decode }}"

- name: Display Raft cluster peers
  ansible.builtin.debug:
    msg: "{{ (openbao_raft_peers_raw.stdout | from_json).data.config.servers }}"
  run_once: yes

# ---------------------------------------------------------------------------
# Audit device
#
# O device é configurado no cluster (fica no Raft), mas cada node escreve no
# seu próprio arquivo local. O diretório precisa existir em TODOS os nodes
# antes do enable: se um node não conseguir escrever, o OpenBao passa a
# bloquear as requisições nele (audit failure = fail closed).
# ---------------------------------------------------------------------------
- name: Ensure audit log directory exists
  ansible.builtin.file:
    path: "{{ openbao_audit_dir }}"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "0750"
  when: openbao_audit_enabled | bool

- name: Deploy audit log rotation
  ansible.builtin.template:
    src: openbao-logrotate.j2
    dest: /etc/logrotate.d/openbao
    owner: root
    group: root
    mode: "0644"
  when: openbao_audit_enabled | bool

- name: Check which audit devices are enabled
  ansible.builtin.command: /usr/bin/bao audit list -format=json
  register: openbao_audit_devices
  changed_when: false
  failed_when: false
  run_once: yes
  environment:
    BAO_ADDR: "http://127.0.0.1:8200"
    BAO_TOKEN: "{{ primary_root_token_b64.content | b64decode }}"

- name: Warn when the audit device is still missing
  ansible.builtin.debug:
    msg: >-
      Nenhum audit device ativo. O stanza `audit` do openbao.hcl é aplicado no
      boot/reload do node ativo; se o arquivo já foi atualizado, reinicie o
      serviço para ativá-lo.
  when:
    - openbao_audit_enabled | bool
    - openbao_audit_devices.rc == 0
    - "openbao_audit_path ~ '/' not in (openbao_audit_devices.stdout | default('{}', true) | from_json)"

- name: Display enabled audit devices
  ansible.builtin.debug:
    var: openbao_audit_devices.stdout
  run_once: yes


