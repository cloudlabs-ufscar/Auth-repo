---
- name: Install tinyproxy package
  ansible.builtin.apt:
    name: tinyproxy
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Deploy tinyproxy configuration
  ansible.builtin.template:
    src: tinyproxy.conf.j2
    dest: /etc/tinyproxy/tinyproxy.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart tinyproxy

- name: Deploy tinyproxy whitelist filter
  ansible.builtin.template:
    src: filter.j2
    dest: /etc/tinyproxy/filter
    owner: root
    group: root
    mode: '0644'
  notify: Restart tinyproxy

- name: Ensure tinyproxy service is enabled and started
  ansible.builtin.systemd:
    name: tinyproxy
    state: started
    enabled: true
