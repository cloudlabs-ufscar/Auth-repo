---
# defaults file for deploy
openbao_url: "http://vault.maas:8200"
openbao_token: ""
openbao_jwt_role: "github-actions"
# Mount do auth JWT. Parametrizado para permitir testar a cadeia contra um mount
# descartavel (ex.: jwt-test) sem tocar no mount real.
openbao_jwt_mount: "jwt"

# Usuario/banco tem default porque nao sao segredo.
# Senha NAO tem default de proposito: se o OpenBao nao responder, o playbook falha.
postgres_keycloak_user: "keycloak"
postgres_keycloak_db: "keycloak"

postgres_openfga_user: "postgres"
postgres_openfga_db: "postgres"

keycloak_admin_user: "admin"

github_client_id: ""
github_client_secret: ""

openstack_client_secret: ""
