global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# ----------------------------------------------------
# FRONTEND & BACKEND - OPENFGA (Porta 8080)
# ----------------------------------------------------
frontend openfga_front
    bind *:8080 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem
    default_backend openfga_back

backend openfga_back
    # Encaminha para a porta HTTP interna do OpenFGA
    server openfga_srv openfga:8080 check

# ----------------------------------------------------
# FRONTEND & BACKEND - KEYCLOAK (Porta 8443)
# ----------------------------------------------------
frontend keycloak_front
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem
    
    # Headers essenciais para o Keycloak saber que está atrás de um proxy TLS
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 8443
    
    default_backend keycloak_back

backend keycloak_back
    # Encaminha para a porta HTTP interna do Keycloak
    server keycloak_srv keycloak:8080 check
