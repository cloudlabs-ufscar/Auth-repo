---
# Tasks to dynamically fetch secrets from OpenBao for IAM components

- name: Check for local OpenBao token file on target host
  ansible.builtin.stat:
    path: "{{ openbao_token_file }}"
  register: openbao_token_stat

- name: Read OpenBao token from file if available
  ansible.builtin.slurp:
    src: "{{ openbao_token_file }}"
  register: openbao_token_slurp
  when: openbao_token_stat.stat.exists

- name: Determine active OpenBao token
  ansible.builtin.set_fact:
    active_openbao_token: "{{ openbao_token | default(lookup('env', 'OPENBAO_TOKEN'), true) | default((openbao_token_slurp.content | b64decode | trim) if (openbao_token_slurp is defined and openbao_token_slurp.content is defined) else '', true) }}"

- name: Fetch IAM Database secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/database"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_db_response
  ignore_errors: yes
  when: active_openbao_token | length > 0

- name: Fetch IAM Keycloak secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/keycloak"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_kc_response
  ignore_errors: yes
  when: active_openbao_token | length > 0

- name: Fetch IAM GitHub OAuth secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/github"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_gh_response
  ignore_errors: yes
  when: active_openbao_token | length > 0

- name: Set facts from OpenBao secrets (with fallback to defaults)
  ansible.builtin.set_fact:
    postgres_keycloak_user: "{{ (openbao_db_response.json.data.data.postgres_keycloak_user if (openbao_db_response is not failed and openbao_db_response.json is defined) else none) | default(postgres_keycloak_user | default('keycloak'), true) }}"
    postgres_keycloak_password: "{{ (openbao_db_response.json.data.data.postgres_keycloak_password if (openbao_db_response is not failed and openbao_db_response.json is defined) else none) | default(postgres_keycloak_password | default('password'), true) }}"
    postgres_keycloak_db: "{{ (openbao_db_response.json.data.data.postgres_keycloak_db if (openbao_db_response is not failed and openbao_db_response.json is defined) else none) | default(postgres_keycloak_db | default('keycloak'), true) }}"
    postgres_openfga_user: "{{ (openbao_db_response.json.data.data.postgres_openfga_user if (openbao_db_response is not failed and openbao_db_response.json is defined) else none) | default(postgres_openfga_user | default('postgres'), true) }}"
    postgres_openfga_password: "{{ (openbao_db_response.json.data.data.postgres_openfga_password if (openbao_db_response is not failed and openbao_db_response.json is defined) else none) | default(postgres_openfga_password | default('password'), true) }}"
    postgres_openfga_db: "{{ (openbao_db_response.json.data.data.postgres_openfga_db if (openbao_db_response is not failed and openbao_db_response.json is defined) else none) | default(postgres_openfga_db | default('postgres'), true) }}"
    keycloak_admin_user: "{{ (openbao_kc_response.json.data.data.admin_user if (openbao_kc_response is not failed and openbao_kc_response.json is defined) else none) | default(keycloak_admin_user | default('admin'), true) }}"
    keycloak_admin_password: "{{ (openbao_kc_response.json.data.data.admin_password if (openbao_kc_response is not failed and openbao_kc_response.json is defined) else none) | default(keycloak_admin_password | default('password!!!!'), true) }}"
    github_client_id: "{{ (openbao_gh_response.json.data.data.client_id if (openbao_gh_response is not failed and openbao_gh_response.json is defined) else none) | default(github_client_id | default(''), true) }}"
    github_client_secret: "{{ (openbao_gh_response.json.data.data.client_secret if (openbao_gh_response is not failed and openbao_gh_response.json is defined) else none) | default(github_client_secret | default(''), true) }}"
