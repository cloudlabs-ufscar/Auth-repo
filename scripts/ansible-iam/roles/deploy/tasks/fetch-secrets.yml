---
# Busca de segredos no OpenBao para os componentes do IAM.
#
# REGRA: se um segredo nao puder ser lido, o playbook FALHA.
# Nao existe fallback para "password": um deploy que sobe com senha errada e pior
# que um deploy que para, porque ele parece ter dado certo.

# --- Credencial: AppRole (preferencial) -------------------------------------
# AppRole nao expira: faz login a cada execucao e recebe um token de 1h.
# Token estatico sempre apodrece (todo token nao-root do OpenBao morre em 768h).

- name: Check for deploy AppRole credentials on target host
  ansible.builtin.stat:
    path: "{{ openbao_approle_file }}"
  register: openbao_approle_stat

- name: Read deploy AppRole credentials
  ansible.builtin.slurp:
    src: "{{ openbao_approle_file }}"
  register: openbao_approle_slurp
  when: openbao_approle_stat.stat.exists
  no_log: true

- name: Parse deploy AppRole credentials
  ansible.builtin.set_fact:
    openbao_approle_role_id: "{{ (openbao_approle_slurp.content | b64decode).splitlines() | select('match', '^role_id=') | map('regex_replace', '^role_id=', '') | first | default('') }}"
    openbao_approle_secret_id: "{{ (openbao_approle_slurp.content | b64decode).splitlines() | select('match', '^secret_id=') | map('regex_replace', '^secret_id=', '') | first | default('') }}"
  when: openbao_approle_stat.stat.exists
  no_log: true

- name: Login to OpenBao via AppRole
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ openbao_approle_role_id }}"
      secret_id: "{{ openbao_approle_secret_id }}"
    status_code: [200]
  register: openbao_approle_login
  when: openbao_approle_stat.stat.exists
  no_log: true

# --- Credencial: token estatico (alternativa) -------------------------------

- name: Check for local OpenBao token file on target host
  ansible.builtin.stat:
    path: "{{ openbao_token_file }}"
  register: openbao_token_stat

- name: Read OpenBao token from file if available
  ansible.builtin.slurp:
    src: "{{ openbao_token_file }}"
  register: openbao_token_slurp
  when: openbao_token_stat.stat.exists
  no_log: true

- name: Determine active OpenBao token
  ansible.builtin.set_fact:
    active_openbao_token: >-
      {{ openbao_approle_login.json.auth.client_token
         if (openbao_approle_login.json is defined and openbao_approle_login.json.auth is defined)
         else (openbao_token | default(lookup('env', 'OPENBAO_TOKEN'), true)
               | default((openbao_token_slurp.content | b64decode | trim) if (openbao_token_slurp is defined and openbao_token_slurp.content is defined) else '', true)) }}
  no_log: true

- name: Fail when no OpenBao credential is available
  ansible.builtin.fail:
    msg: >-
      Nenhuma credencial do OpenBao disponivel. Configure {{ openbao_approle_file }}
      (role_id/secret_id) ou {{ openbao_token_file }}. Sem credencial o deploy nao
      consegue ler os segredos e NAO deve continuar.
  when: active_openbao_token | length == 0

# Falha explicita se o token estiver revogado/expirado, em vez de 403 em cada leitura.
- name: Validate OpenBao token
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/token/lookup-self"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
  register: openbao_token_lookup
  no_log: true

# --- Leitura dos segredos (sem ignore_errors) -------------------------------

- name: Fetch IAM Database secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/database"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_db_response
  no_log: true

- name: Fetch IAM Keycloak secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/keycloak"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_kc_response
  no_log: true

- name: Fetch IAM GitHub OAuth secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/github"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_gh_response
  no_log: true

- name: Fetch IAM OpenStack secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/openstack"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_os_response
  no_log: true

# --- Facts (chave ausente = falha, nunca default) ---------------------------

- name: Set facts from OpenBao secrets
  ansible.builtin.set_fact:
    postgres_keycloak_user: "{{ openbao_db_response.json.data.data.postgres_keycloak_user | mandatory }}"
    postgres_keycloak_password: "{{ openbao_db_response.json.data.data.postgres_keycloak_password | mandatory }}"
    postgres_keycloak_db: "{{ openbao_db_response.json.data.data.postgres_keycloak_db | mandatory }}"
    postgres_openfga_user: "{{ openbao_db_response.json.data.data.postgres_openfga_user | mandatory }}"
    postgres_openfga_password: "{{ openbao_db_response.json.data.data.postgres_openfga_password | mandatory }}"
    postgres_openfga_db: "{{ openbao_db_response.json.data.data.postgres_openfga_db | mandatory }}"
    keycloak_admin_user: "{{ openbao_kc_response.json.data.data.admin_user | mandatory }}"
    keycloak_admin_password: "{{ openbao_kc_response.json.data.data.admin_password | mandatory }}"
    github_client_id: "{{ openbao_gh_response.json.data.data.client_id | mandatory }}"
    github_client_secret: "{{ openbao_gh_response.json.data.data.client_secret | mandatory }}"
    openstack_client_secret: "{{ openbao_os_response.json.data.data.client_secret | mandatory }}"
  no_log: true

- name: Assert secrets are not empty
  ansible.builtin.assert:
    that:
      - postgres_keycloak_password | length > 0
      - postgres_openfga_password | length > 0
      - keycloak_admin_password | length > 0
      - github_client_id | length > 0
      - github_client_secret | length > 0
      - openstack_client_secret | length > 0
    fail_msg: >-
      Um ou mais segredos lidos do OpenBao estao vazios. O deploy nao deve
      configurar componentes com valor em branco.
  no_log: true
