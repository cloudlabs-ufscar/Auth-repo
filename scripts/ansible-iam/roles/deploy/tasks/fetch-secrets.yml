---
# Busca de segredos no OpenBao para os componentes do IAM.
#
# REGRA: se um segredo nao puder ser lido, o playbook FALHA.
# Nao existe fallback para "password": um deploy que sobe com senha errada e pior
# que um deploy que para, porque ele parece ter dado certo.

# --- Credencial --------------------------------------------------------------
# Duas portas de entrada, ambas explicitas (nao existe fallback silencioso):
#   1. `-e openbao_token=<token>`: execucao manual de um operador;
#   2. JWT do GitHub Actions (`ACTIONS_ID_TOKEN`): trocado na role `github-actions`
#      por um token de 15 min. So existe quando o job roda com
#      `permissions: id-token: write` (ver .github/workflows/deploy.yml).
# O JWT e lido no controller (nimbus) e o login sai do host do IAM (idp.maas).

- name: Read the GitHub Actions OIDC token from the environment
  ansible.builtin.set_fact:
    openbao_actions_jwt: "{{ lookup('env', 'ACTIONS_ID_TOKEN') | default('', true) | trim }}"
  no_log: true

- name: Fail when there is neither an explicit token nor a GitHub OIDC token
  ansible.builtin.fail:
    msg: >-
      Sem credencial do OpenBao. No CI o job precisa de `permissions: id-token: write`
      (o JWT chega em ACTIONS_ID_TOKEN); manualmente, rode com
      `-e openbao_token=<token>`.
  when:
    - openbao_token | default('', true) | length == 0
    - openbao_actions_jwt | length == 0

- name: Log in to OpenBao with the GitHub OIDC token
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/{{ openbao_jwt_mount }}/login"
    method: POST
    body_format: json
    body:
      role: "{{ openbao_jwt_role }}"
      jwt: "{{ openbao_actions_jwt }}"
    status_code: [200]
  register: openbao_jwt_login
  when: openbao_actions_jwt | length > 0
  no_log: true

- name: Determine the active OpenBao token
  ansible.builtin.set_fact:
    active_openbao_token: >-
      {{ openbao_token if (openbao_token | default('', true) | length > 0)
         else (openbao_jwt_login.json.auth.client_token | default('')) }}
  no_log: true

- name: Fail when no OpenBao token was obtained
  ansible.builtin.fail:
    msg: "Login no OpenBao nao devolveu token (role {{ openbao_jwt_role }})."
  when: active_openbao_token | length == 0

# Falha explicita se o token estiver revogado/expirado, em vez de 403 em cada leitura.
- name: Validate OpenBao token
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/token/lookup-self"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
  register: openbao_token_lookup
  no_log: true

# --- Leitura dos segredos (sem ignore_errors) -------------------------------

- name: Fetch IAM Database secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/database"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_db_response
  no_log: true

- name: Fetch IAM Keycloak secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/keycloak"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_kc_response
  no_log: true

- name: Fetch IAM GitHub OAuth secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/github"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_gh_response
  no_log: true

- name: Fetch IAM OpenStack secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/iam/openstack"
    method: GET
    headers:
      X-Vault-Token: "{{ active_openbao_token }}"
    status_code: [200]
    return_content: yes
  register: openbao_os_response
  no_log: true

# --- Facts (chave ausente = falha, nunca default) ---------------------------

- name: Set facts from OpenBao secrets
  ansible.builtin.set_fact:
    postgres_keycloak_user: "{{ openbao_db_response.json.data.data.postgres_keycloak_user | mandatory }}"
    postgres_keycloak_password: "{{ openbao_db_response.json.data.data.postgres_keycloak_password | mandatory }}"
    postgres_keycloak_db: "{{ openbao_db_response.json.data.data.postgres_keycloak_db | mandatory }}"
    postgres_openfga_user: "{{ openbao_db_response.json.data.data.postgres_openfga_user | mandatory }}"
    postgres_openfga_password: "{{ openbao_db_response.json.data.data.postgres_openfga_password | mandatory }}"
    postgres_openfga_db: "{{ openbao_db_response.json.data.data.postgres_openfga_db | mandatory }}"
    keycloak_admin_user: "{{ openbao_kc_response.json.data.data.admin_user | mandatory }}"
    keycloak_admin_password: "{{ openbao_kc_response.json.data.data.admin_password | mandatory }}"
    github_client_id: "{{ openbao_gh_response.json.data.data.client_id | mandatory }}"
    github_client_secret: "{{ openbao_gh_response.json.data.data.client_secret | mandatory }}"
    openstack_client_secret: "{{ openbao_os_response.json.data.data.client_secret | mandatory }}"
  no_log: true

- name: Assert secrets are not empty
  ansible.builtin.assert:
    that:
      - postgres_keycloak_password | length > 0
      - postgres_openfga_password | length > 0
      - keycloak_admin_password | length > 0
      - github_client_id | length > 0
      - github_client_secret | length > 0
      - openstack_client_secret | length > 0
    fail_msg: >-
      Um ou mais segredos lidos do OpenBao estao vazios. O deploy nao deve
      configurar componentes com valor em branco.
  no_log: true
