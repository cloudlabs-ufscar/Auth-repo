[defaults]
inventory = ./inventory
roles_path = ./roles
collections_path = ./collections

remote_user = root 

host_key_checking = False

remote_tmp = /tmp/.ansible-${USER}/tmp

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
scp_if_ssh = False
transfer_method = smart