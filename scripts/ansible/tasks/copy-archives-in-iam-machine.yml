---
# =================================================
# Task para apenas copiar arquivos necessários
# na máquina de IAM.
# =================================================
- name: Deploy IAM Stack
  hosts: all
  become: true
  vars:
    deploy_dir: /opt/iam
    keycloak_schema: "{{ deploy_dir }}/schema-keycloak.json"
    certificate_file: "{{ deploy_dir }}/tls.crt"
  tasks:
    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copying necessary archives in the target IAM machine
      block:
        - name: Copy Keycloak schema
          ansible.builtin.copy:
            src: tasks/schema-keycloak.json
            dest: "{{ keycloak_schema }}"
            mode: "0644"

        #- name: Copy TLS certificate
        #  ansible.builtin.copy:
        #    src: files/tls.crt
        #    dest: "{{ certificate_file }}"
        #    mode: "0644"

        - name: Copy cron jon certbot script
          ...

        - name: Copy docker-compose.yml
          ansible.builtin.template:
            src: templates/docker-compose.yml
            dest: "{{ deploy_dir }}/docker-compose.yml"
            mode: "0644"